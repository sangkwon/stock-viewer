# 정해진 시각에 Vercel의 /api/report 를 호출해 Slack 리포트를 보낸다.
# (Vercel Hobby 플랜의 Cron은 하루 1회까지라 GitHub Actions를 트리거로 사용)
# GitHub Actions는 UTC 기준이며 수 분 지연되거나 드물게 누락될 수 있다.
#
# 필요 설정 (저장소 Settings → Secrets and variables → Actions):
#   Secret   CRON_SECRET       Vercel 환경변수 CRON_SECRET 과 같은 값
#   Variable REPORT_BASE_URL   예: https://stock-viewer-xxxx.vercel.app (끝에 / 없이)
name: Slack report

on:
  schedule:
    # 국내 (월~금, KST 09:30 / 11:30 / 13:30 / 15:00)
    - cron: "30 0 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "30 4 * * 1-5"
    - cron: "0 6 * * 1-5"
    # 미국: 장 시작 30분 후(10:00 ET), 마감 30분 전(15:30 ET)
    # 서머타임/표준시에 따라 UTC가 1시간 달라지므로 둘 다 호출하고, 서버가 뉴욕 시각을 보고 맞는 쪽만 전송한다.
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "30 19 * * 1-5"
    - cron: "30 20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "kr 또는 us"
        required: true
        default: kr
      force:
        description: "시간대/휴장 판단을 무시하고 전송 (true/false)"
        default: "false"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/report
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.REPORT_BASE_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          if [ -n "$INPUT_MODE" ]; then
            MODE="$INPUT_MODE"
          else
            case "$SCHEDULE" in
              "30 0 * * 1-5"|"30 2 * * 1-5"|"30 4 * * 1-5"|"0 6 * * 1-5") MODE=kr ;;
              *) MODE=us ;;
            esac
          fi
          FORCE=""
          [ "$INPUT_FORCE" = "true" ] && FORCE="&force=1"
          curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/report?mode=$MODE$FORCE"
          echo
