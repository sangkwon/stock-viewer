# 수동 실행 전용: Vercel의 /api/report 를 호출해 Slack 리포트를 한 번 보낸다. (Actions → Slack report → Run workflow)
# 예약 실행은 GitHub Actions의 schedule 이 수 시간 지연되거나 누락되어 cron-job.org 로 옮겼다 (scripts/cronjob_setup.py).
#
# 필요 설정 (저장소 Settings → Secrets and variables → Actions):
#   Secret   CRON_SECRET       Vercel 환경변수 CRON_SECRET 과 같은 값
#   Variable REPORT_BASE_URL   예: https://stock-viewer-xxxx.vercel.app (끝에 / 없이)
name: Slack report

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "kr 또는 us"
        required: true
        default: kr
      force:
        description: "시간대/휴장 판단을 무시하고 전송 (true/false)"
        default: "false"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/report
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.REPORT_BASE_URL }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          FORCE=""
          [ "$INPUT_FORCE" = "true" ] && FORCE="&force=1"
          # wait=1: 리포트가 끝날 때까지 기다렸다가 결과를 로그에 남긴다
          curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/report?mode=$INPUT_MODE&wait=1$FORCE"
          echo
